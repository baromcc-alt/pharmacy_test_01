document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ddf662f4-b130-4ed8-bde7-e866657ad3d8\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>/* Doctornow Design System — Webfonts\n * Pretendard (OFL) — the system's single typeface.\n * Served from jsDelivr (orioncactus/pretendard). If you self-host,\n * swap these src URLs for local woff2 files. */\n\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 800;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2\") format(\"woff2\");\n}\n<\u002Fstyle>\n<style>/* Doctornow Design System — Color tokens\n * Base palettes (Gray, Primary/Orange, Blue, Green, Yellow, Red) mirror the\n * Figma color page exactly. Semantic aliases below map raw values to roles.\n * Use the SEMANTIC tokens in product code; reserve raw scale tokens for\n * building new components or one-off tints. */\n\n:root {\n  /* ── Gray scale (the workhorse neutral) ───────────────────────── */\n  --dn-white:     #FFFFFF;\n  --dn-gray-10:   #FBFCFD;\n  --dn-gray-20:   #F7F9FA;\n  --dn-gray-30:   #F5F6F7;\n  --dn-gray-40:   #F1F3F6;\n  --dn-gray-50:   #EDEFF0;\n  --dn-gray-100:  #DFE1E2;\n  --dn-gray-200:  #C6CACE;\n  --dn-gray-300:  #A9AEB1;\n  --dn-gray-400:  #8D9297;\n  --dn-gray-500:  #71767A;\n  --dn-gray-600:  #565C65;\n  --dn-gray-700:  #3D4551;\n  --dn-gray-800:  #2D2E2F;\n  --dn-gray-900:  #1C1D1F;\n  --dn-black:     #000000;\n\n  /* ── Primary (Orange) — the brand color ───────────────────────── */\n  --dn-primary-100: #FFF4E6;\n  --dn-primary-200: #FFE8CC;\n  --dn-primary-300: #FFD8A8;\n  --dn-primary-400: #FFC078;\n  --dn-primary-500: #FF8D00;\n  --dn-primary-600: #FD7E14; /* brand primary */\n  --dn-primary-700: #F76707; /* pressed / strong */\n  --dn-primary-800: #E8590C;\n  --dn-primary-900: #D9480F;\n\n  /* ── Blue (info / link) ───────────────────────────────────────── */\n  --dn-blue-100: #E7F5FF;\n  --dn-blue-200: #D0EBFF;\n  --dn-blue-300: #A5D8FF;\n  --dn-blue-400: #74C0FC;\n  --dn-blue-500: #339AF0;\n  --dn-blue-600: #228BE6;\n  --dn-blue-700: #1C7ED6;\n  --dn-blue-800: #1971C2;\n  --dn-blue-900: #1864AB;\n\n  /* ── Green (success / open / available) ───────────────────────── */\n  --dn-green-100: #EBFBEE;\n  --dn-green-200: #D3F9D8;\n  --dn-green-300: #B2F2BB;\n  --dn-green-400: #8CE99A;\n  --dn-green-500: #51CF66;\n  --dn-green-600: #40C057;\n  --dn-green-700: #37B24D;\n  --dn-green-800: #2F9E44;\n  --dn-green-900: #2B8A3E;\n\n  /* ── Yellow (caution / rating) ────────────────────────────────── */\n  --dn-yellow-100: #FFF9DB;\n  --dn-yellow-200: #FFF3BF;\n  --dn-yellow-300: #FFEC99;\n  --dn-yellow-400: #FFE066;\n  --dn-yellow-500: #FCC419;\n  --dn-yellow-600: #FAB005;\n  --dn-yellow-700: #F59F00;\n  --dn-yellow-800: #F08C00;\n  --dn-yellow-900: #E67700;\n\n  /* ── Red (error / destructive / closed) ───────────────────────── */\n  --dn-red-100: #FFF5F5;\n  --dn-red-200: #FFE3E3;\n  --dn-red-300: #FFC9C9;\n  --dn-red-400: #FFA8A8;\n  --dn-red-500: #FF6B6B;\n  --dn-red-600: #FA5252;\n  --dn-red-700: #F03E3E;\n  --dn-red-800: #E03131;\n  --dn-red-900: #C92A2A;\n\n  /* ── Dimmed (overlay / scrim) ─────────────────────────────────── */\n  --dn-dimmed-20: rgba(0, 0, 0, 0.20);\n  --dn-dimmed-40: rgba(0, 0, 0, 0.40);\n  --dn-dimmed-80: rgba(0, 0, 0, 0.80);\n\n  /* ── Semantic: brand ──────────────────────────────────────────── */\n  --dn-color-primary:           var(--dn-primary-600);\n  --dn-color-primary-hover:     var(--dn-primary-700);\n  --dn-color-primary-pressed:   var(--dn-primary-800);\n  --dn-color-primary-surface:   var(--dn-primary-100);\n  --dn-color-primary-on:        var(--dn-white);\n\n  /* ── Semantic: text ───────────────────────────────────────────── */\n  --dn-text-strong:      var(--dn-gray-900); /* titles, primary copy   */\n  --dn-text-default:     var(--dn-gray-700); /* body                    */\n  --dn-text-sub:         var(--dn-gray-500); /* secondary / captions    */\n  --dn-text-disabled:    var(--dn-gray-300);\n  --dn-text-placeholder: var(--dn-gray-400);\n  --dn-text-on-primary:  var(--dn-white);\n  --dn-text-link:        var(--dn-blue-700);\n  --dn-text-brand:       var(--dn-primary-700);\n\n  /* ── Semantic: surface ────────────────────────────────────────── */\n  --dn-surface-base:     var(--dn-white);  /* page background          */\n  --dn-surface-sunken:   var(--dn-gray-30); /* grouped section bg       */\n  --dn-surface-card:     var(--dn-white);\n  --dn-surface-raised:   var(--dn-white);\n  --dn-surface-disabled: var(--dn-gray-50);\n  --dn-surface-fill:     var(--dn-gray-40); /* chips, inert fills       */\n\n  /* ── Semantic: border ─────────────────────────────────────────── */\n  --dn-border-default: var(--dn-gray-100);\n  --dn-border-strong:  var(--dn-gray-200);\n  --dn-border-subtle:  var(--dn-gray-50);\n  --dn-border-focus:   var(--dn-primary-600);\n\n  /* ── Semantic: status ─────────────────────────────────────────── */\n  --dn-status-success:         var(--dn-green-700);\n  --dn-status-success-surface: var(--dn-green-100);\n  --dn-status-info:            var(--dn-blue-600);\n  --dn-status-info-surface:    var(--dn-blue-100);\n  --dn-status-warning:         var(--dn-yellow-800);\n  --dn-status-warning-surface: var(--dn-yellow-100);\n  --dn-status-error:           var(--dn-red-700);\n  --dn-status-error-surface:   var(--dn-red-100);\n}\n<\u002Fstyle>\n<style>/* Doctornow Design System — Typography tokens\n * Single typeface: Pretendard. Four weights in active use:\n *   Regular 400 · Medium 500 · SemiBold 600 · Bold 700 (+ ExtraBold 800)\n *\n * The type system has four families, mirroring the Figma Typo page:\n *   • UI Title  — screen & section headings (Bold / SemiBold), 20–48px\n *   • UI Text   — primary interface copy (B/SB/M/R), 13–19px\n *   • UI Sub    — captions, labels, fine print (M/R), 10–12px\n *   • Article   — long-form reading copy with looser line-height, 15–17px\n *\n * Naming: --dn-font-{family}-{size}-{weight?}. Each size carries a matched\n * line-height. Weight is applied via the --dn-fw-* tokens. */\n\n:root {\n  /* ── Family stack ─────────────────────────────────────────────── */\n  --dn-font-sans: \"Pretendard\", -apple-system, BlinkMacSystemFont, \"Apple SD Gothic Neo\",\n    \"Segoe UI\", Roboto, \"Helvetica Neue\", \"Malgun Gothic\", sans-serif;\n\n  /* ── Weights ──────────────────────────────────────────────────── */\n  --dn-fw-regular:  400; /* @kind font */\n  --dn-fw-medium:   500; /* @kind font */\n  --dn-fw-semibold: 600; /* @kind font */\n  --dn-fw-bold:     700; /* @kind font */\n  --dn-fw-extrabold: 800; /* @kind font */\n\n  /* ── UI Title: size / line-height ─────────────────────────────── */\n  --dn-title-48-size: 48px;  --dn-title-48-lh: 64px;\n  --dn-title-40-size: 40px;  --dn-title-40-lh: 52px;\n  --dn-title-36-size: 36px;  --dn-title-36-lh: 48px;\n  --dn-title-32-size: 32px;  --dn-title-32-lh: 42px;\n  --dn-title-28-size: 28px;  --dn-title-28-lh: 38px;\n  --dn-title-26-size: 26px;  --dn-title-26-lh: 36px;\n  --dn-title-24-size: 24px;  --dn-title-24-lh: 32px;\n  --dn-title-22-size: 22px;  --dn-title-22-lh: 30px;\n  --dn-title-20-size: 20px;  --dn-title-20-lh: 28px;\n\n  /* ── UI Text ──────────────────────────────────────────────────── */\n  --dn-text-19-size: 19px;   --dn-text-19-lh: 28px;\n  --dn-text-17-size: 17px;   --dn-text-17-lh: 24px;\n  --dn-text-15-size: 15px;   --dn-text-15-lh: 22px;\n  --dn-text-13-size: 13px;   --dn-text-13-lh: 18px;\n\n  /* ── UI Sub ───────────────────────────────────────────────────── */\n  --dn-sub-12-size: 12px;    --dn-sub-12-lh: 18px;\n  --dn-sub-11-size: 11px;    --dn-sub-11-lh: 14px;\n  --dn-sub-10-size: 10px;    --dn-sub-10-lh: 12px;\n\n  /* ── Article (long-form, looser leading) ──────────────────────── */\n  --dn-article-17-size: 17px; --dn-article-17-lh: 30px;\n  --dn-article-15-size: 15px; --dn-article-15-lh: 28px;\n\n  /* ── Letter-spacing (Pretendard reads best at 0 / slight neg) ──── */\n  --dn-tracking-tight:  -0.02em;\n  --dn-tracking-normal: 0;\n}\n<\u002Fstyle>\n<style>/* Doctornow Design System — Spacing, radius, shadow & layout tokens\n * Spacing is a 4px-based scale. Korean mobile UI: dense but breathable,\n * 20px screen gutters, 12–16px between cards. */\n\n:root {\n  /* ── Spacing scale (4px base) ─────────────────────────────────── */\n  --dn-space-0:  0px;\n  --dn-space-2:  2px;\n  --dn-space-4:  4px;\n  --dn-space-6:  6px;\n  --dn-space-8:  8px;\n  --dn-space-10: 10px;\n  --dn-space-12: 12px;\n  --dn-space-14: 14px;\n  --dn-space-16: 16px;\n  --dn-space-20: 20px;\n  --dn-space-24: 24px;\n  --dn-space-28: 28px;\n  --dn-space-32: 32px;\n  --dn-space-40: 40px;\n  --dn-space-48: 48px;\n  --dn-space-56: 56px;\n  --dn-space-64: 64px;\n\n  /* Semantic spacing */\n  --dn-gutter-mobile: 20px;  /* horizontal screen padding (app)   */\n  --dn-gutter-web:    24px;  /* desktop content padding           */\n  --dn-stack-card:    12px;  /* gap between stacked list cards     */\n  --dn-section-gap:   32px;  /* gap between page sections          */\n\n  /* ── Corner radius ────────────────────────────────────────────── */\n  --dn-radius-2:    2px;\n  --dn-radius-4:    4px;   /* tag / inline pill        */\n  --dn-radius-6:    6px;   /* button S, small chip     */\n  --dn-radius-8:    8px;   /* input, button M, chip    */\n  --dn-radius-10:   10px;  /* button L                 */\n  --dn-radius-12:   12px;  /* button XL, card          */\n  --dn-radius-16:   16px;  /* large card, sheet inner  */\n  --dn-radius-20:   20px;  /* bottom sheet top corners */\n  --dn-radius-24:   24px;\n  --dn-radius-full: 9999px; /* avatar, toggle, pill chip */\n\n  /* ── Elevation / shadow ───────────────────────────────────────── */\n  /* Shadows lean soft & low-spread — black at low alpha. */\n  --dn-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);\n  --dn-shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.04);\n  --dn-shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);\n  --dn-shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.12), 0 8px 32px rgba(0, 0, 0, 0.08);\n  /* Bottom sheets / floating bars lift upward */\n  --dn-shadow-up: 0 -2px 12px rgba(0, 0, 0, 0.06);\n  /* Floating action / pressed marker */\n  --dn-shadow-marker: 0 2px 8px rgba(0, 0, 0, 0.24);\n\n  /* ── Motion ───────────────────────────────────────────────────── */\n  --dn-ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --dn-ease-out:      cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --dn-duration-fast: 120ms; /* @kind other */\n  --dn-duration-base: 200ms; /* @kind other */\n  --dn-duration-slow: 320ms; /* @kind other */\n\n  /* ── Layout ───────────────────────────────────────────────────── */\n  --dn-tap-target: 44px;   /* minimum touch target               */\n  --dn-header-h:   56px;   /* t-19-lh); }\n.dn-text-17    { font-size: var(--dn-text-17-size); line-height: var(--dn-text-17-lh); }\n.dn-text-15    { font-size: var(--dn-text-15-size); line-height: var(--dn-text-15-lh); }\n.dn-text-13    { font-size: var(--dn-text-13-size); line-height: var(--dn-text-13-lh); }\n\n.dn-sub-12 { font-size: var(--dn-sub-12-size); line-height: var(--dn-sub-12-lh); }\n.dn-sub-11 { font-size: var(--dn-sub-11-size); line-height: var(--dn-sub-11-lh); }\n\n.dn-fw-regular  { font-weight: var(--dn-fw-regular); }\n.dn-fw-medium   { font-weight: var(--dn-fw-medium); }\n.dn-fw-semibold { font-weight: var(--dn-fw-semibold); }\n.dn-fw-bold     { font-weight: var(--dn-fw-bold); }\n<\u002Fstyle>\n<style>/* ════════════════════════════════════════════════════════════════\n * Doctornow Design System (DDS)\n * Global stylesheet entry point — consumers link THIS file only.\n * Keep this file a list of @import lines. Add new token files here.\n * ════════════════════════════════════════════════════════════════ */\n\n/* Doctornow Design System — Webfonts\n * Pretendard (OFL) — the system's single typeface.\n * Served from jsDelivr (orioncactus/pretendard). If you self-host,\n * swap these src URLs for local woff2 files. */\n\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Medium.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Pretendard\";\n  font-weight: 800;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-ExtraBold.woff2\") format(\"woff2\");\n}\n\n/* Doctornow Design System — Color tokens\n * Base palettes (Gray, Primary/Orange, Blue, Green, Yellow, Red) mirror the\n * Figma color page exactly. Semantic aliases below map raw values to roles.\n * Use the SEMANTIC tokens in product code; reserve raw scale tokens for\n * building new components or one-off tints. */\n\n:root {\n  /* ── Gray scale (the workhorse neutral) ───────────────────────── */\n  --dn-white:     #FFFFFF;\n  --dn-gray-10:   #FBFCFD;\n  --dn-gray-20:   #F7F9FA;\n  --dn-gray-30:   #F5F6F7;\n  --dn-gray-40:   #F1F3F6;\n  --dn-gray-50:   #EDEFF0;\n  --dn-gray-100:  #DFE1E2;\n  --dn-gray-200:  #C6CACE;\n  --dn-gray-300:  #A9AEB1;\n  --dn-gray-400:  #8D9297;\n  --dn-gray-500:  #71767A;\n  --dn-gray-600:  #565C65;\n  --dn-gray-700:  #3D4551;\n  --dn-gray-800:  #2D2E2F;\n  --dn-gray-900:  #1C1D1F;\n  --dn-black:     #000000;\n\n  /* ── Primary (Orange) — the brand color ───────────────────────── */\n  --dn-primary-100: #FFF4E6;\n  --dn-primary-200: #FFE8CC;\n  --dn-primary-300: #FFD8A8;\n  --dn-primary-400: #FFC078;\n  --dn-primary-500: #FF8D00;\n  --dn-primary-600: #FD7E14; /* brand primary */\n  --dn-primary-700: #F76707; /* pressed / strong */\n  --dn-primary-800: #E8590C;\n  --dn-primary-900: #D9480F;\n\n  /* ── Blue (info / link) ───────────────────────────────────────── */\n  --dn-blue-100: #E7F5FF;\n  --dn-blue-200: #D0EBFF;\n  --dn-blue-300: #A5D8FF;\n  --dn-blue-400: #74C0FC;\n  --dn-blue-500: #339AF0;\n  --dn-blue-600: #228BE6;\n  --dn-blu \n      { name: '오나우', fav: false, visits: '', phone: '010-7128-0052', time: '26.03.05 / 16:42', method: '방문수령', status: '접수대기' },\n      { name: '홍길동', fav: true, visits: '8번방문', phone: '010-2802-3287', time: '26.02.11 / 16:32', method: '방문수령', status: '접수대기' },\n    ],\n  };\n\n  renderVals() {\n    const options = ['바로 준비 가능', '1시간 이후', '3시간 이후', '6시간 이후'];\n    const tabDefs = [\n      { label: '접수 대기', key: '접수대기', base: 0 },\n      { label: '결제 대기', key: '결제대기', base: 0 },\n      { label: '조제 중', key: '조제중', base: 17 },\n      { label: '수령 대기', key: '수령대기', base: 5 },\n      { label: '취소', key: '취소', base: 0 },\n    ];\n    const activeKey = tabDefs[this.state.tabIndex].key;\n\n    const statusTabs = tabDefs.map((t, i) => {\n      const active = i === this.state.tabIndex;\n      const count = t.base + this.state.rows.filter((r) => r.status === t.key).length;\n      const redBadge = t.key === '조제중';\n      return {\n        label: t.label,\n        count: count,\n        on: () => this.setState({ tabIndex: i }),\n        weight: active ? 700 : 500,\n        color: active ? 'var(--dn-gray-900)' : 'var(--dn-gray-400)',\n        border: active ? 'var(--dn-gray-900)' : 'transparent',\n        badgeBg: redBadge ? 'var(--dn-red-500)' : (active ? 'var(--dn-gray-900)' : 'var(--dn-gray-100)'),\n        badgeColor: (redBadge || active) ? '#fff' : 'var(--dn-gray-500)',\n      };\n    });\n\n    const openRow = (i) => this.setState({\n      view: 'detail', phase: 'review', selected: i,\n      visitTime: '바로 준비 가능', guideReason: '', guideReasonText: '', rxTab: 0,\n      altIndex: 0, altReason: '', durChecked: false, medChecked: false, price: '18,400',\n    });\n\n    const filteredRows = this.state.rows\n      .map((r, i) => ({\n        name: r.name, fav: r.fav, visits: r.visits, phone: r.phone,\n        time: r.time, method: r.method, status: r.status,\n        open: () => openRow(i),\n      }))\n      .filter((r) => r.status === activeKey);\n\n    const cur = this.state.rows[this.state.selected];\n\n    return {\n      isList: this.state.view === 'list',\n      isDetail: this.state.view === 'detail',\n      isReview: this.state.view === 'detail' && this.state.phase === 'review',\n      isAccept: this.state.view === 'detail' && this.state.phase === 'accept',\n      acceptDispense: () => this.setState({ phase: 'accept' }),\n      rxDrugs: [\n        { code: '650301142', name: '지나시드 건조시럽 2.4g/30mL', info: '1/1/1' },\n        { code: '671805622', name: '코대원 포르테 시럽 20ml', info: '6/2/0' },\n        { code: '643507901', name: '히알루 미니 점안액 0.15% 0.5mL', info: '2/3/20' },\n      ],\n      statusTabs,\n      searchFields: ['환자명', '전화번호', '접수번호'],\n      searchField: this.state.searchField,\n      setSearchField: (v) => this.setState({ searchField: v }),\n      sortOptions: ['최신순', '오래된순'],\n      sortOrder: this.state.sortOrder,\n      setSort: (v) => this.setState({ sortOrder: v }),\n      filteredRows,\n\n      options,\n      curName: cur.name,\n      curTime: cur.time,\n      curPhone: cur.phone,\n      visitTime: this.state.visitTime,\n      setVisitTime: (v) => this.setState({ visitTime: v }),\n      reasonNeeded: this.state.visitTime !== '바로 준비 가능',\n      guideReasonOptions: ['약 재고 준비까지 시간 필요', '휴식 시간이 포함되어있음', '직접입력'],\n      guideReason: this.state.guideReason,\n      setGuideReason: (v) => this.setState({ guideReason: v }),\n      reasonIsCustom: this.state.guideReason === '직접입력',\n      guideReasonText: this.state.guideReasonText,\n      setGuideReasonText: (e) => this.setState({ guideReasonText: e && e.target ? e.target.value : e }),\n\n      processSteps: [\n        { label: '접수', status: 'current' },\n        { label: '결제', status: 'upcoming' },\n        { label: '조제', status: 'upcoming' },\n        { label: '픽업', status: 'upcoming' },\n        { label: '완료', status: 'upcoming' },\n      ],\n\n      rxTab0Weight: this.state.rxTab === 0 ? 700 : 500,\n      rxTab0Color: this.state.rxTab === 0 ? 'var(--dn-gray-900)' : 'var(--dn-gray-400)',\n      rxTab0Border: this.state.rxTab === 0 ? 'var(--dn-primary-600)' : 'transparent',\n      rxTab1Weight: this.state.rxTab === 1 ? 700 : 500,\n      rxTab1Color: this.state.rxTab === 1 ? 'var(--dn-gray-900)' : 'var(--dn-gray-400)',\n      rxTab1Border: this.state.rxTab === 1 ? 'var(--dn-primary-600)' : 'transparent',\n      setRx0: () => this.setState({ rxTab: 0 }),\n      setRx1: () => this.setState({ rxTab: 1 }),\n\n      altItems: ['처방전 그대로', '대체 조제'],\n      altIndex: this.state.altIndex,\n      setAlt: (i) => this.setState({ altIndex: i }),\n      reasonOptions: ['재고 없음', '동일 성분 대체', '환자 요청', '기타'],\n      altReason: this.state.altReason,\n      setAltReason: (v) => this.setState({ altReason: v }),\n      reasonDisabled: this.state.altIndex === 0,\n\n      price: this.state.price,\n      setPrice: (e) => this.setState({ price: e && e.target ? e.target.value : e }),\n      medChecked: this.state.medChecked,\n      setMed: (c) => this.setState({ medChecked: c }),\n\n      durChecked: this.state.durChecked,\n      setDur: (c) => this.setState({ durChecked: c }),\n      durLabel: '[필수] DUR에 처방전을 등록했습니다.',\n      payDisabled: !this.state.durChecked,\n\n      goBack: () => this.setState({ view: 'list' }),\n      reject: () => {\n        const sel = this.state.selected;\n        this.setState((s) => {\n          const rows = s.rows.slice();\n          rows[sel] = { ...rows[sel], status: '취소' };\n          return { rows, view: 'list', toast: '조제를 거절했어요. 환자에게 안내가 전송됐어요.' };\n        });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ toast: null }), 4000);\n      },\n      requestPayment: () => {\n        if (!this.state.durChecked) return;\n        const vt = this.state.visitTime;\n        const sel = this.state.selected;\n        this.setState((s) => {\n          const rows = s.rows.slice();\n          rows[sel] = { ...rows[sel], status: '조제중' };\n          return {\n            rows,\n            view: 'list',\n            toast: `결제요청이 완료됐어요. 환자에게 방문 안내(${vt})를 전송했어요.`,\n          };\n        });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ toast: null }), 4200);\n      },\n      toast: this.state.toast,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
